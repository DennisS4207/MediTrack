name: Python CI/CD Pipeline

# Definiert, wann die Pipeline starten soll
on:
  push:
    branches: [ "main" ] # Startet bei jedem Push auf den Hauptbranch
  pull_request:
    branches: [ "main" ] # Startet, wenn ein PR gegen main geöffnet wird

  workflow_dispatch: #Erlaubt das manuelle Starten des Workflows im Actions Tab 

# Minimale Rechte; der JUnit-Report benötigt checks: write
permissions:
  contents: read
  checks: write
  pull-requests: write
  
jobs:
  # ----------------------------------------------------
  # JOB 1: Continuous Integration (Prüfen & Testen)
  # ----------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
    # 1. Holt den Code aus dem Repository
    - name: Code auschecken
      uses: actions/checkout@v4

    # 2. Richtet die gewünschte Python-Version ein
    - name: Python ${{ matrix.python-version }} einrichten
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # 3. Installiert die in requirements.txt definierten Pakete
    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Code-Qualität prüfen (Linting) mit flake8
    - name: Code mit flake8 prüfen
      run: |
        # Harte Fehler: Syntaxfehler, undefinierte Namen
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=.git,venv,.venv,build,dist,__pycache__
        # Weitere Hinweise: stoppen den Build nicht
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
          --exclude=.git,venv,.venv,build,dist,__pycache__

    # 5. Automatisierte Tests mit pytest ausführen
    - name: Tests ausführen
      run: |
        pytest --junitxml=pytest.xml
        
    # 7. Testberichte direkt in GitHub Actions anzeigen
    - name: Testberichte veröffentlichen
      uses: mikepenz/action-junit-report@v4
      if: ${{ !cancelled() }}  # Läuft bei Erfolg und Fehler, nicht bei Abbruch
      with:
        report_paths: '**/pytest.xml'
        check_name: Testbericht (Python ${{ matrix.python-version }})
  # ----------------------------------------------------
  # JOB 2: Continuous Deployment (Nur wenn CI erfolgreich)
  # ----------------------------------------------------
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Kein Deployment bei Pull Requests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    
    steps:
    - name: Code auf den Produktivserver übertragen (via SSH)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script_stop: true  # Bricht bei jedem Fehler im Skript ab
        script: |
          set -e
          cd /var/www/mein-projekt
          git fetch origin main
          git reset --hard origin/main
          source venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart mein-python-dienst
