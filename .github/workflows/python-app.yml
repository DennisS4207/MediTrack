# CI-Pipeline für MediTrack (GitHub Actions)
# Läuft bei jedem Push (auch auf Feature-Branches) und bei jedem Pull Request gegen main.
# Ein Pull Request sollte erst gemerged werden, wenn alle Schritte grün sind.

name: Python application

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # manuelles Starten im Actions-Tab

permissions:
  contents: read

# Veraltete Läufe desselben Branches abbrechen (Push + Pull Request starten sonst doppelt)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python ${{ matrix.python-version }} einrichten
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint mit flake8 (Syntaxfehler und undefinierte Namen brechen den Build)
      run: |
        flake8 meditrack test main.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Stil-Prüfung mit flake8 (muss ebenfalls sauber sein)
      run: |
        flake8 meditrack test main.py --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Architektur-Regeln prüfen (Bounded Contexts / DDD-Schichten)
      run: |
        pytest test/test_architektur.py -v

    - name: Alle Tests ausführen (inkl. Coverage, mindestens 90 %)
      run: |
        pytest --cov=meditrack --cov-report=term-missing --cov-report=xml \
               --cov-fail-under=90 --junitxml=test-results.xml

    - name: Testergebnisse und Coverage-Bericht speichern
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: testergebnisse-python-${{ matrix.python-version }}
        path: |
          test-results.xml
          coverage.xml
