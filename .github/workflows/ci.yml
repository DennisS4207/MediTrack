name: MediTrack CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Python Build, Tests und Code Quality
    runs-on: ubuntu-latest

    steps:
      # 1. Repository herunterladen
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python installieren
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Abhängigkeiten installieren
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. Python-Code auf Syntaxfehler prüfen
      - name: Check Python Syntax
        run: |
          python -m compileall -q .

      # 5. BONUS: Code Linting
      - name: Ruff Linting
        run: |
          ruff check .

      # 6. Automatisierte Tests ausführen, wenn da
      - name: Run Unit Tests
        run: |
          if find tests -name "test_*.py" -type f 2>/dev/null | grep -q .; then
            python -m pytest -v
          else
            echo "Noch keine Tests vorhanden."
            echo "Tests werden später ergänzt."
          fi


      # 7. BONUS: Code Coverage
      - name: Generate Coverage Report
        run: |
          if find tests -name "test_*.py" -type f 2>/dev/null | grep -q .; then
            python -m pytest \
              --cov=app \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-report=html:htmlcov
          else
            echo "Noch keine Tests vorhanden."
            echo "Coverage wird später aktiviert."
          fi


      # 8. BONUS: Coverage Report speichern
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meditrack-coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
